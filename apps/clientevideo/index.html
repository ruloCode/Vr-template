<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cliente Video Sincronizado - Ecopetrol</title>

    <!-- PWA Meta tags -->
    <meta name="theme-color" content="#667eea">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Video Ecopetrol">
    <meta name="description" content="Cliente de video sincronizado para eventos educativos de Ecopetrol">

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json">

    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Connection Status -->
    <div id="status-bar" class="status-bar">
        <div class="status-indicator" id="ws-status">
            <span class="status-dot disconnected"></span>
            <span id="status-text">Conectando...</span>
        </div>
        <div class="device-info">
            <span id="device-id">Dispositivo: -</span>
        </div>
        <button id="fullscreen-toggle" class="fullscreen-toggle" title="Pantalla completa">
            <svg class="fullscreen-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
            </svg>
        </button>
    </div>

    <!-- Video Container -->
    <div id="video-container" class="video-container">
        <video
            id="video-player"
            class="video-player"
            preload="auto"
            playsinline
            webkit-playsinline>
            Tu navegador no soporta video HTML5.
        </video>

        <!-- Ready State Overlay -->
        <div id="ready-overlay" class="ready-overlay hidden">
            <div class="ready-content">
                <div class="ready-icon">✓</div>
                <h2 class="ready-title">Listo para Reproducir</h2>
                <p class="ready-subtitle">Esperando comandos del dashboard</p>
                <div class="ready-pulse"></div>
            </div>
        </div>

        <!-- Loading Indicator -->
        <div id="loading" class="loading-overlay hidden">
            <div class="spinner"></div>
            <p id="loading-text">Cargando video...</p>
        </div>

        <!-- Play Button Overlay (for mobile) -->
        <div id="play-overlay" class="play-overlay hidden">
            <button id="play-button" class="play-button">▶</button>
            <p>Toca para reproducir</p>
        </div>
    </div>

    <!-- Debug Info (dev only) -->
    <div id="debug-info" class="debug-info hidden">
        <div>Video: <span id="debug-video">-</span></div>
        <div>Estado: <span id="debug-state">-</span></div>
        <div>Tiempo: <span id="debug-time">-</span></div>
        <div>Latencia: <span id="debug-latency">-</span></div>
    </div>

    <!-- Service Worker Registration -->
    <script>
        // Register Service Worker for offline support
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', async () => {
                try {
                    const registration = await navigator.serviceWorker.register('/sw.js');
                    console.log('✅ Service Worker registered:', registration.scope);

                    // Listen for SW messages
                    navigator.serviceWorker.addEventListener('message', (event) => {
                        const { type, data } = event.data;

                        switch (type) {
                            case 'SW_ACTIVATED':
                                console.log('🚀 Service Worker activated, version:', data?.version);
                                break;
                            case 'PRELOAD_COMPLETE':
                                console.log('✅ Video preloaded:', data?.videoUrl, 'Cached:', data?.cached);
                                break;
                            case 'PRELOAD_ERROR':
                                console.error('❌ Video preload error:', data?.videoUrl, data?.error);
                                break;
                            case 'CACHE_CLEARED':
                                console.log('🗑️ Cache cleared for:', data?.cacheNames);
                                break;
                        }
                    });
                } catch (error) {
                    console.error('❌ Service Worker registration failed:', error);
                }
            });
        } else {
            console.warn('⚠️ Service Workers are not supported in this browser');
        }
    </script>

    <script src="client.js"></script>
</body>
</html>
