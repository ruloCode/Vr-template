<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Ejemplo VR Paisaje - Rulocode</title>
    <meta
      name="description"
      content="Ejemplo simple de VR con paisaje usando A-Frame y assets locales"
    />
    <script src="aframe-v1.3.0.min.js"></script>
    <script src="scenes-config.js"></script>
    <script src="sequence-config.js"></script>
    <script src="websocket-client.js"></script>
    <style>
      body {
        margin: 0;
      }
      .a-loader-title {
        font-family: sans-serif;
      }
    </style>
  </head>
  <body>
    <a-scene background="color: #88c">
      <!-- Audio y assets - Dynamic loading -->
      <a-assets>
        <audio id="current-audio" src="audio/toma_01.mp3"></audio>
        <img id="current-skybox" src="images/base.jpg" />

        <!-- Solar videos for floating screen (Scene 1 only) -->
        <video
          id="solar-1-video"
          src="videos/escena%201/solar_1.MP4"
          preload="metadata"
          loop="false"
          crossorigin="anonymous"
          muted
          playsinline
        ></video>
        <video
          id="solar-2-video"
          src="videos/escena%201/solar_2.MP4"
          preload="metadata"
          loop="false"
          crossorigin="anonymous"
          muted
          playsinline
        ></video>
        <video
          id="solar-3-video"
          src="videos/escena%201/solar_3.MP4"
          preload="metadata"
          loop="false"
          crossorigin="anonymous"
          muted
          playsinline
        ></video>

        <!-- Petroleo images for floating screen (Scene 2 only) -->
        <img id="escena_2.1-image" src="images/escena%202/escena_2.1.jpg" />
        <img id="escena_2.2-image" src="images/escena%202/escena_2.2.jpg" />
        <img id="escena_2.3-image" src="images/escena%202/escena_2.3.jpg" />

        <!-- images for floating screen (Scene 3 only) -->
        <img id="escena_3.1-image" src="images/escena%203/escena_3.1.jpg" />

        <img id="escena_3.5-image" src="images/escena%203/escena_3.5.jpg" />
        <img id="escena_3.6-image" src="images/escena%203/escena_3.6.jpg" />

        <!-- Videos for Scene 4 -->
        <video
          id="escena4-1-video"
          src="videos/escena%204/escena_4.1.mp4"
          preload="metadata"
          loop="true"
          crossorigin="anonymous"
          muted
          playsinline
        ></video>
        <video
          id="escena4-2-video"
          src="videos/escena%204/escena_4.2.mp4"

        <video
          id="escena4-3-video"
          src="videos/escena%204/escena_4.3.mp4"
          preload="metadata"
          loop="true"
          crossorigin="anonymous"
          muted
          playsinline
        ></video>

        <!-- Images for Scene 5 -->
        <img id="escena5-1-image" src="images/escena%205/escena_5.1.jpeg" />
        <img id="escena5-2-image" src="images/escena%205/escena_5.2.jpeg" />
        <img id="escena5-3-image" src="images/escena%205/escena_5.3.png" />

        <img id="escena5B-1-image" src="images/escena%205/escena_5.4.jpg" />
        <img id="escena5B-2-image" src="images/escena%205/escena_5.5.jpg" />

        <!-- Images for Scene 6 -->
        <img id="escena6-1-image" src="images/escena%206/escena_6.1.jpg" />
        <img id="escena6-2-image" src="images/escena%206/escena_6.2.jpg" />
        <img id="escena6-3-image" src="images/escena%206/escena_6.3.jpg" />

        <video

        ></video>
        <video
          id="escena6-2-video"
          src="videos/escena%206/escena_6.5.mp4"

          muted
          playsinline
        ></video>

        <!-- Images for Scene 7 -->
        <img id="escena7-1-image" src="images/escena%207/escena_7.1.jpg" />
        <img id="escena7-2-image" src="images/escena%207/escena_7.2.jpg" />
        <img id="escena7-3-image" src="images/escena%207/escena_7.3.jpg" />
        <img id="escena7-4-image" src="images/escena%207/escena_7.4.jpg" />

        <video
          id="escena7-1-video"
          src="videos/escena%207/escena_7.6.mp4"
          preload="metadata"
          loop="true"
          crossorigin="anonymous"
          muted
          playsinline
        ></video>
        <video
          id="escena7-2-video"
          src="videos/escena%207/escena_7.7.mp4"

          crossorigin="anonymous"
          muted
          playsinline
        ></video>

        <!-- Images for Scene 8 -->
        <img id="escena8-1-image" src="images/escena%208/escena_8.1.jpg" />
        <img id="escena8-2-image" src="images/escena%208/escena_8.2.jpg" />

        <img id="escena8B-1-image" src="images/escena%208/escena_8.3.jpg" />
        <img id="escena8B-2-image" src="images/escena%208/escena_8.4.jpeg" />

        <!-- Images for Scene 9 -->
        <img id="escena9-1-image" src="images/escena%209/escena_9.1.jpg" />
        <img id="escena9-2-image" src="images/escena%209/escena_9.2.jpg" />
        <img id="escena9-3-image" src="images/escena%209/escena_9.3.jpg" />

        <!-- Video for Scene 9 - Video file not available -->
        <!-- <video
          id="escena9-1-video"
          src="videos/escena%209/escena_9.4.mp4"
          preload="metadata"
          loop="true"
          crossorigin="anonymous"
          muted
        ></video> -->

        <!-- Images for Scene 10 -->
        <img id="escena10-1-image" src="images/escena%2010/escena_10.1.jpg" />
        <img id="escena10-2-image" src="images/escena%2010/escena_10.2.png" />
        <img id="escena10-3-image" src="images/escena%2010/escena_10.3.jpeg" />

        <img id="escena10B-1-image" src="images/escena%2010/escena_10.4.jpg" />
        <img id="escena10B-2-image" src="images/escena%2010/escena_10.5.jpg" />
        <img id="escena10B-3-image" src="images/escena%2010/escena_10.6.jpg" />

        <!-- Images for Scene 11 -->
        <img id="escena11-1-image" src="images/escena%2011/escena_11.1.jpg" />
        <img id="escena11-2-image" src="images/escena%2011/escena_11.2.jpg" />

        <!-- Video for Scene 11 -->
        <video
          id="escena11-1-video"
          src="videos/escena%2011/escena_11.3.mp4"
          preload="metadata"
          loop="true"
          crossorigin="anonymous"
          muted
          playsinline
        ></video>
      </a-assets>

      <!-- Scene loading overlay -->
      <a-entity
        id="scene-overlay"
        geometry="primitive: sphere; radius: 10"
        material="color: black; opacity: 0; side: back"
        position="0 0 0"
        visible="false"
      >
        <!-- Texto visible desde cualquier dirección -->
        <a-text
          id="loading-text-front"
          value="Cargando Escena..."
          position="0 0 -9.5"
          align="center"
          color="white"
          scale="2 2 2"
        ></a-text>
        <a-text
          id="loading-text-back"
          value="Cargando Escena..."
          position="0 0 9.5"
          align="center"
          color="white"
          scale="2 2 2"
          rotation="0 180 0"
        ></a-text>
        <a-text
          id="loading-text-left"
          value="Cargando Escena..."
          position="-9.5 0 0"
          align="center"
          color="white"
          scale="2 2 2"
          rotation="0 90 0"
        ></a-text>
        <a-text
          id="loading-text-right"
          value="Cargando Escena..."
          position="9.5 0 0"
          align="center"
          color="white"
          scale="2 2 2"
          rotation="0 -90 0"
        ></a-text>
      </a-entity>

      <!-- Audio component -->
      <a-sound
        id="scene-sound"
        src="#current-audio"
        autoplay="true"
        loop="false"
        volume="0.5"
      ></a-sound>

      <!-- Skybox esférico -->
      <a-sky id="scene-skybox" src="#current-skybox" rotation="0 -90 0"></a-sky>

      <!-- Single floating screen that cycles through solar videos (Scene 1 only) -->
      <a-plane
        id="escena1-screen"
        src="#solar-1-video"
        position="100 0 20"
        rotation="-20 90 0"
        width="120"
        height="80"
        material="shader: flat; side: double"
        visible="false"
        solar-video-cycler
      ></a-plane>

      <!-- Single floating screen that cycles through petroleo images (Scene 2 only) -->
      <a-plane
        id="escena2-screen"
        src="#escena_2.1-image"
        position="100 20 20"
        rotation="-30 90 0"
        width="180"
        height="100"
        material="shader: flat; side: double"
        visible="false"
        escena2-image-cycler
      ></a-plane>

      <!-- Single floating screen that cycles through plataforma images (Scene 3 only) -->
      <a-plane
        id="escena3-screen"
        src="#escena_3.1-image"
        position="-120 20 20"
        rotation="30 90 0"
        width="200"
        height="120"
        material="shader: flat; side: double"
        visible="false"
        escena3a-image-cycler
      ></a-plane>

      <a-plane
        id="escena3B-screen"
        src="#escena_3.4-image"
        position="120 20 20"
        rotation="-30 90 0"
        width="200"
        height="120"
        material="shader: flat; side: double"
        visible="false"
        escena3b-image-cycler
      ></a-plane>

      <!-- Single floating screen that cycles through escena 4 videos (Scene 4 only) -->
      <a-plane
        id="escena4-screen"
        src="#escena4-1-video"
        position="-120 20 20"
        rotation="30 90 0"
        width="160"
        height="90"
        material="shader: flat; side: double"
        visible="false"
        escena4-video-cycler
      ></a-plane>

      <a-plane
        id="escena4B-screen"
        src="#escena4-3-video"
        position="120 20 20"
        rotation="-30 90 0"
        width="160"
        height="90"
        material="shader: flat; side: double"
        visible="false"
        escena4b-video-cycler
      ></a-plane>

      <!-- Single floating screen that cycles through escena 5 images (Scene 5 only) -->
      <a-plane
        id="escena5-screen"
        src="#escena5-1-image"
        position="-120 20 20"
        rotation="30 90 0"
        width="160"
        height="90"
        material="shader: flat; side: double"
        visible="false"
        escena5-image-cycler
      ></a-plane>

      <a-plane
        id="escena5B-screen"
        src="#escena5B-1-image"
        position="120 20 20"
        rotation="-30 90 0"
        width="160"
        height="90"
        material="shader: flat; side: double"
        visible="false"
        escena5b-image-cycler
      ></a-plane>

      <!-- Single floating screen that cycles through escena 6 images (Scene 6 only) -->
      <a-plane
        id="escena6-screen"
        src="#escena6-1-image"
        position="-120 10 20"
        rotation="30 90 0"
        width="170"
        height="95"
        material="shader: flat; side: double"
        visible="false"
        escena6-image-cycler
      ></a-plane>

      <a-plane
        id="escena6B-screen"
        src="#escena6-1-video"
        position="150 10 20"
        rotation=" 0 90 0"
        width="100"
        height="50"
        material="shader: flat; side: double"
        visible="false"
        escena6b-video-cycler
      ></a-plane>

      <!-- Single floating screen that cycles through escena 7 images (Scene 7 only) -->
      <a-plane
        id="escena7-screen"
        src="#escena7-1-image"
        position="-120 20 20"
        rotation="30 90 0"
        width="180"
        height="100"
        material="shader: flat; side: double"
        visible="false"
        escena7-image-cycler
      ></a-plane>

      <a-plane
        id="escena7B-screen"
        src="#escena7-1-video"
        position="120 20 20"
        rotation="-30 90 0"
        width="180"
        height="100"
        material="shader: flat; side: double"
        visible="false"
        escena7b-video-cycler
      ></a-plane>

      <!-- Single floating screen that cycles through escena 8 images (Scene 8 only) -->
      <a-plane
        id="escena8-screen"
        src="#escena8-1-image"
        position="-120 20 20"
        rotation="30 90 0"
        width="180"
        height="100"
        material="shader: flat; side: double"
        visible="false"
        escena8-image-cycler
      ></a-plane>

      <a-plane
        id="escena8B-screen"
        src="#escena8B-1-image"
        position="120 20 20"
        rotation="-30 90 0"
        width="180"
        height="100"
        material="shader: flat; side: double"
        visible="false"
        escena8b-image-cycler
      ></a-plane>

      <!-- Single floating screen that cycles through escena 9 images (Scene 9 only) -->
      <a-plane
        id="escena9-screen"
        src="#escena9-1-image"
        position="-200 20 -100"
        rotation="30 90 0"
        width="200"
        height="110"
        material="shader: flat; side: double"
        visible="false"
        escena9-image-cycler
      ></a-plane>

      <!-- <a-plane
        id="escena9B-screen"
        src="#escena9-1-video"
        position="200 150 -90"
        rotation="-30 90 0"
        width="200"
        height="110"
        material="shader: flat; side: double"
        visible="false"
        escena9b-video-cycler
      ></a-plane> -->

      <!-- Single floating screen that cycles through escena 10 images (Scene 10 only) -->
      <a-plane
        id="escena10-screen"
        src="#escena10-1-image"
        position="-120 20 80"
        rotation="30 90 0"
        width="200"
        height="110"
        material="shader: flat; side: double"
        visible="false"
        escena10-image-cycler
      ></a-plane>

      <a-plane
        id="escena10B-screen"
        src="#escena10B-1-image"
        position="120 20 80"
        rotation="-30 90 0"
        width="200"
        height="110"
        material="shader: flat; side: double"
        visible="false"
        escena10b-image-cycler
      ></a-plane>

      <!-- Single floating screen that cycles through escena 11 images (Scene 11 only) -->
      <a-plane
        id="escena11-screen"
        src="#escena11-1-image"
        position="-200 20 20"
        rotation="30 90 0"
        width="220"
        height="120"
        material="shader: flat; side: double"
        visible="false"
        escena11-image-cycler
      ></a-plane>

      <a-plane
        id="escena11B-screen"
        src="#escena11-1-video"
        position="200 20 80"
        rotation="-30 90 0"
        width="220"
        height="120"
        material="shader: flat; side: double"
        visible="false"
        escena11b-video-cycler
      ></a-plane>

      <!-- Lighting system -->
      <a-entity
        id="ambient-light"
        light="type: ambient; color: #ffffff; intensity: 0.7"
      ></a-entity>

      <a-entity
        id="directional-light"
        light="type: directional; color: #ffeeaa; intensity: 0.8"
        position="0 1 1"
      ></a-entity>

      <!-- 3D Models container (empty for clean 360° view) -->
      <a-entity id="scene-models">
        <!-- Models will be loaded dynamically from scene config -->
      </a-entity>

      <!-- Cámara y controles VR -->
      <a-entity
        id="main-camera"
        camera
        look-controls
        position="0 0 0"
        rotation="0 0 0"
      ></a-entity>

      <!-- Load modularized JavaScript -->
      <script type="module" src="js/app.js"></script>
    </a-scene>
  </body>
</html>
